name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Check formatting
      run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

    - name: Vet
      run: go vet ./...

    - name: Run tests
      run: go test -race -v ./...
